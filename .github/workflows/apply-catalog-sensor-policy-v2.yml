name: Apply catalog sensor policy v2

on:
  push:
    branches:
      - catalog-publication-cleanup

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: catalog-publication-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Apply catalog and sensor policy
        run: python tools/apply_catalog_sensor_policy.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile Python sources
        run: python -m compileall -q app.py app core models services tests utils

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-catalog-sensor-policy-v2.yml tools/apply_catalog_sensor_policy.py
          git add data/vehicle_catalog.json data/vehicle_source_metadata_v3_2.json data/source_register_v3_2_addendum.md core/energy.py core/assumptions.py tests/test_sensor_inclusion.py tests/test_vehicle_catalog.py tests/test_energy.py tests/test_model_reasonableness.py tests/test_app_callbacks.py
          git commit -m 'Apply catalog sensor-in-endurance policy'
          git push origin HEAD:catalog-publication-cleanup
